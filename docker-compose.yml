services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      VOC_CORS_ORIGINS: "http://localhost:8080"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro
