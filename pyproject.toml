[project]
name = "vmc"
version = "0.1.0"
description = "VMC — Vulnerability Management Center: multi-agent, provider-agnostic exposure management platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
gemini = ["google-generativeai>=0.7"]
groq = ["groq>=0.9"]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
